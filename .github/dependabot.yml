version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /rust/faithfulframe-core
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: deps
  - package-ecosystem: cargo
    directory: /rust/faithfulframe-ffi
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: deps
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: deps
