name: Plugin Build

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
    tags:
      - '*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - main

env:
  artifactName: ${{ contains(github.ref_name, '/') && 'artifact' || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux_build:
    runs-on: ${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: 30
            ubuntu: 'ubuntu-22.04'
          - obs: 31
            ubuntu: 'ubuntu-24.04'
          - obs: 33
            ubuntu: 'ubuntu-26.04'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}-ccache

      - name: Setup ccache
        run: |
          sudo apt install ccache
          ccache --set-config=cache_dir="${{ github.workspace }}/.ccache"
          ccache --set-config=compression=true

      - name: Download obs-studio development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@v3
        with:
          obs: ${{ matrix.obs }}
          verbose: true

      - name: Download dlib-models
        run: |
          set -ex
          DESTDIR='./' ci/download-dlib-models.sh

      - name: Build plugin
        run: |
          set -ex
          sudo apt install -y \
            libopenblas-dev libopenblas0 \
            || true
          export OPENBLAS_HOME=/lib/x86_64-linux-gnu/
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D ENABLE_RUST_CORE_BRIDGE=ON \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D PKG_SUFFIX=-obs${{ matrix.obs }}-${{ matrix.ubuntu }}-x86_64 \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}
          python3 -m unittest tests/test_verify_package_assets.py
          cd build
          make -j4
          ctest --output-on-failure
          make package
          deb_file=$(find . -name '*.deb' -print -quit)
          test -n "$deb_file"
          mkdir -p package-audit
          dpkg-deb --extract "$deb_file" package-audit
          python3 ../ci/verify-package-assets.py --root package-audit
          echo "FILE_NAME=$(find $PWD -name '*.deb' | head -n 1)" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifactName }}-linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}
          path: '${{ env.FILE_NAME }}'

      - name: 'Setup with onsdriver'
        id: onsdriver_setup
        uses: noris-plugins-for-obs/onsdriver@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: ${{ env.FILE_NAME }}
          first-time-log: ./logs/
        # Launchpad occasionally returns transient 5xx errors while the driver
        # resolves the OBS PPA. Retry once, but keep setup required overall.
        continue-on-error: true

      - name: Wait before onsdriver retry
        if: steps.onsdriver_setup.outcome == 'failure'
        run: sleep 30

      - name: Retry setup with onsdriver
        if: steps.onsdriver_setup.outcome == 'failure'
        uses: noris-plugins-for-obs/onsdriver@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: ${{ env.FILE_NAME }}
          first-time-log: ./logs/

      - name: 'Test with onsdriver'
        run: |
          python -m unittest discover test-onsdriver/

      - name: 'Upload logs of onsdriver'
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ env.artifactName }}-linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}
          path: |
            logs/*

  macos_build:
    runs-on: ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: 32
            arch: 'x86_64'
            obs-onsdriver: '< 33'
            macos: macos-26-intel # Intel x86_64
          - obs: 33
            arch: 'x86_64'
            macos: macos-26-intel # Intel x86_64
          - obs: 32
            arch: 'arm64'
            obs-onsdriver: '< 33'
            macos: macos-26 # Apple arm64
          - obs: 33
            arch: 'arm64'
            macos: macos-26 # Apple arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Setup Environment
        id: setup
        run: |
          set -e
          echo '::group::Set up code signing'
          if [[ '${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}' != '' && \
                '${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}' != '' && \
                '${{ secrets.MACOS_SIGNING_CERT }}' != '' ]]; then
            echo "haveCodesignIdent=true" >> $GITHUB_OUTPUT
          else
            echo "haveCodesignIdent=false" >> $GITHUB_OUTPUT
          fi
          if [[ '${{ secrets.MACOS_NOTARIZATION_USERNAME }}' != '' && \
                '${{ secrets.MACOS_NOTARIZATION_PASSWORD }}' != '' ]]; then
            echo "haveNotarizationUser=true" >> $GITHUB_OUTPUT
          else
            echo "haveNotarizationUser=false" >> $GITHUB_OUTPUT
          fi
          echo '::endgroup::'
          echo '::group::Set up ccache'
          brew install ccache
          ccache --set-config=cache_dir="${{ github.workspace }}/.ccache"
          ccache --set-config=compression=true
          echo '::endgroup::'

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: macos-obs${{ matrix.obs }}-${{ matrix.arch }}-ccache

      - name: Install Apple Developer Certificate
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        uses: apple-actions/import-codesign-certs@fe74d46e82474f87e1ba79832ad28a4013d0e33a # v6.1.0
        with:
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERT }}
          p12-password: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Set Signing Identity
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && steps.setup.outputs.haveNotarizationUser == 'true' }}
        run: |
          set -e
          TEAM_ID=$(echo "${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}" | sed 's/.*(\([A-Za-z0-9]*\))$/\1/')
          xcrun notarytool store-credentials AC_PASSWORD \
            --apple-id "${{ secrets.MACOS_NOTARIZATION_USERNAME }}" \
            --team-id "$TEAM_ID" \
            --password "${{ secrets.MACOS_NOTARIZATION_PASSWORD }}"

      - name: Download obs-studio development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@v3
        with:
          arch: ${{ matrix.arch }}
          obs: ${{ matrix.obs }}
          verbose: true

      - name: Download dlib-models
        run: |
          set -ex
          DESTDIR='./' ci/download-dlib-models.sh

      - name: Build plugin
        run: |
          arch=${{ matrix.arch }}
          GIT_TAG=$(git describe --tags --always)
          PKG_SUFFIX=-${GIT_TAG}-obs${{ matrix.obs }}-macos-${{ matrix.arch }}
          set -e
          # Exercise the repository's pre-project macOS 13 default.
          unset MACOSX_DEPLOYMENT_TARGET
          unset OPENBLAS_HOME
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          test -f "$SDKROOT/usr/lib/libcblas.tbd"
          test -f "$SDKROOT/usr/lib/liblapack.tbd"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_RUST_CORE_BRIDGE=ON \
            -DCMAKE_PREFIX_PATH="$PWD/release/" \
            -DCMAKE_OSX_ARCHITECTURES=$arch \
            -D DLIB_USE_BLAS=ON \
            -D DLIB_USE_LAPACK=ON \
            -D cblas_lib="$SDKROOT/usr/lib/libcblas.tbd" \
            -D lapack_lib="$SDKROOT/usr/lib/liblapack.tbd" \
            -D PKG_SUFFIX=$PKG_SUFFIX \
            -D OBS_BUNDLE_CODESIGN_IDENTITY='${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}' \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}
          cmake --build build --config RelWithDebInfo
          ctest --test-dir build --output-on-failure
          python3 -m unittest tests/test_verify_macos_deployment_target.py

      - name: Prepare package
        run: |
          set -ex
          . build/ci/ci_includes.generated.sh
          cmake --install build --config RelWithDebInfo --prefix=release
          ci/macos/change-rpath.py \
            --exclude-regex='(/usr/lib/|/System/Library/)' \
            --exclude-regex='.*(obs-frontend-api|libobs|/Qt)' \
            --libdir release/${PLUGIN_NAME}.plugin/Contents/lib \
            --verbose \
            release/${PLUGIN_NAME}.plugin/Contents/MacOS/${PLUGIN_NAME}
          for dylib in \
            release/${PLUGIN_NAME}.plugin/Contents/MacOS/${PLUGIN_NAME} \
            release/${PLUGIN_NAME}.plugin/Contents/lib/*.dylib; do
            if test -f "$dylib"; then
              ci/macos/change-rpath.py \
                --exclude-regex='(/usr/lib/|/System/Library/)' \
                --exclude-regex='.*(obs-frontend-api|libobs|/Qt)' \
                --check-invalid-regex='(/usr/local|/opt)' \
                --check "$dylib"
            fi
          done
          python3 ci/macos/verify-deployment-target.py \
            --root release/${PLUGIN_NAME}.plugin \
            --cmake-cache build/CMakeCache.txt

      - name: Codesign
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        run: |
          . build/ci/ci_includes.generated.sh
          set -ex
          files=(
            $(find release/${PLUGIN_NAME}.plugin/ -name '*.dylib')
            release/${PLUGIN_NAME}.plugin/Contents/MacOS/${PLUGIN_NAME}
          )
          for dylib in "${files[@]}"; do
            codesign --force --sign "${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}" "$dylib"
          done
          for dylib in "${files[@]}"; do
            codesign -vvv --deep --strict "$dylib"
          done

      - name: Package
        run: |
          . build/ci/ci_includes.generated.sh
          set -ex
          zipfile=$PWD/package/${PLUGIN_NAME}${PKG_SUFFIX}.zip
          mkdir package
          (cd release/ && zip -r $zipfile ${PLUGIN_NAME}.plugin)
          packagesbuild \
            --build-folder $PWD/package/ \
            build/installer-macOS.generated.pkgproj
          zip_file=$(find package -name '*.zip' -print -quit)
          test -n "$zip_file"
          mkdir -p package-audit
          unzip -q "$zip_file" -d package-audit
          python3 ci/verify-package-assets.py --root package-audit

      - name: Productsign
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        run: |
          . build/ci/ci_includes.generated.sh
          pkgfile=package/${PLUGIN_NAME}${PKG_SUFFIX}.pkg
          set -e
          productsign --sign "${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}" $pkgfile package/${PLUGIN_NAME}-signed.pkg
          mv package/${PLUGIN_NAME}-signed.pkg $pkgfile

      - name: Notarize
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        uses: norihiro/macos-notarize-action@v1
        with:
          path: package/*
          keychainProfile: AC_PASSWORD
          verbose: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: package/*

      - name: 'Setup with onsdriver'
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        uses: noris-plugins-for-obs/onsdriver@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: package/*.pkg
          first-time-log: ./logs/
          obs-version: ${{ matrix.obs-onsdriver }}

      - name: 'Test with onsdriver'
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        run: |
          python -m unittest discover test-onsdriver/

      - name: 'Upload logs of onsdriver'
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: |
            logs/*

  windows_build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: 30
            arch: 'x64'
            runner: 'windows-2022'
            obs-onsdriver: '< 33'
          - obs: 33
            arch: 'x64'
            runner: 'windows-2025-vs2026'
          - obs: 33
            arch: 'arm64'
            runner: 'windows-11-arm'
    env:
      Configuration: 'RelWithDebInfo'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Download obs-studio
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@v3
        with:
          obs: ${{ matrix.obs }}
          arch: ${{ matrix.arch }}

      - name: Download dlib-models
        shell: bash
        run: |
          set -ex
          DESTDIR='./' ci/download-dlib-models.sh

      - name: Build plugin
        run: |
          $CmakeArgs = @()
          $CmakeArgs += '-DENABLE_RUST_CORE_BRIDGE=ON'
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $CmakeArgs += '-DUSE_SSE2_INSTRUCTIONS=OFF'
          }

          cmake -S . -B build ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS_PS }} @CmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with exit code $LASTEXITCODE" }
          cmake --build build --config RelWithDebInfo -j 4
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with exit code $LASTEXITCODE" }
          ctest --test-dir build -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest failed with exit code $LASTEXITCODE" }
          cmake --install build --config RelWithDebInfo --prefix "$(Resolve-Path -Path .)/release"
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed with exit code $LASTEXITCODE" }

      - name: Package plugin
        run: |
          ci/windows/package-windows.cmd ${{ matrix.obs }} ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw "Package build failed with exit code $LASTEXITCODE" }
          $zip = Get-ChildItem package -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Plugin ZIP was not produced" }
          7z x $zip.FullName '-opackage-audit' '-y' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Plugin ZIP extraction failed with exit code $LASTEXITCODE" }
          python ci/verify-package-assets.py --root package-audit
          if ($LASTEXITCODE -ne 0) { throw "Package asset verification failed with exit code $LASTEXITCODE" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifactName }}-windows-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: package/*

      - name: 'Setup with onsdriver'
        uses: noris-plugins-for-obs/onsdriver@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: package/*.exe
          first-time-log: ./logs/
          obs-version: ${{ matrix.obs-onsdriver }}

      - name: 'Test with onsdriver'
        run: |
          python -m unittest discover test-onsdriver/

      - name: 'Upload logs of onsdriver'
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ env.artifactName }}-windows-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: |
            logs/*

  rust_core_tests:
    name: Rust core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust/faithfulframe-core/Cargo.toml -- --check
          cargo fmt --manifest-path rust/faithfulframe-ffi/Cargo.toml -- --check

      - name: Run deterministic core, fixture, and FFI tests
        run: |
          cargo test --manifest-path rust/faithfulframe-core/Cargo.toml
          cargo test --manifest-path rust/faithfulframe-ffi/Cargo.toml

      - name: Run Clippy with warnings denied
        run: |
          cargo clippy --manifest-path rust/faithfulframe-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/faithfulframe-ffi/Cargo.toml --all-targets -- -D warnings
