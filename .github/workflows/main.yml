name: Plugin Build

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
    tags:
      - '*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - main

permissions:
  contents: read

env:
  artifactName: ${{ contains(github.ref_name, '/') && 'artifact' || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux_build:
    runs-on: ${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: 30
            ubuntu: 'ubuntu-22.04'
          - obs: 31
            ubuntu: 'ubuntu-24.04'
          - obs: 33
            ubuntu: 'ubuntu-26.04'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # supports toolchain input
        with:
          toolchain: 1.98.0

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}-ccache

      - name: Setup ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=5 install -y ccache || {
              echo "::warning::ccache could not be installed; continuing without compiler caching"
              exit 0
            }
          fi
          ccache --set-config=cache_dir="${{ github.workspace }}/.ccache"
          ccache --set-config=compression=true

      - name: Download obs-studio development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@02a425c434e39ae068e0bb830bc21bf68273fda3 # v3
        with:
          obs: ${{ matrix.obs }}
          verbose: true

      - name: Download dlib-models
        run: |
          set -ex
          DESTDIR='./' ci/download-dlib-models.sh

      - name: Build plugin
        run: |
          set -ex
          sudo apt install -y \
            libopenblas-dev libopenblas0 \
            || true
          export OPENBLAS_HOME=/lib/x86_64-linux-gnu/
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D ENABLE_RUST_CORE_BRIDGE=ON \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D PKG_SUFFIX=-obs${{ matrix.obs }}-${{ matrix.ubuntu }}-x86_64 \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}
          python3 -m unittest tests/test_verify_package_assets.py
          cd build
          make -j4
          if [[ "${{ matrix.ubuntu }}" == 'ubuntu-24.04' ]]; then
            ctest --repeat until-fail:10 --output-on-failure -R '^faithfulframe-session-executor-smoke$'
          fi
          ctest --output-on-failure
          make package
          deb_file=$(find . -name '*.deb' -print -quit)
          test -n "$deb_file"
          mkdir -p package-audit
          dpkg-deb --extract "$deb_file" package-audit
          python3 ../ci/verify-package-assets.py --root package-audit
          echo "FILE_NAME=$(find $PWD -name '*.deb' | head -n 1)" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.artifactName }}-linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}
          path: '${{ env.FILE_NAME }}'

      - name: 'Setup with onsdriver'
        id: onsdriver_setup
        uses: noris-plugins-for-obs/onsdriver@63e771126ada7a685538e146b87dcfae220384de # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: ${{ env.FILE_NAME }}
          first-time-log: ./logs/
        # Launchpad occasionally returns transient 5xx errors while the driver
        # resolves the OBS PPA. Retry once, but keep setup required overall.
        continue-on-error: true

      - name: Wait before onsdriver retry
        if: steps.onsdriver_setup.outcome == 'failure'
        run: sleep 30

      - name: Retry setup with onsdriver
        if: steps.onsdriver_setup.outcome == 'failure'
        uses: noris-plugins-for-obs/onsdriver@63e771126ada7a685538e146b87dcfae220384de # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: ${{ env.FILE_NAME }}
          first-time-log: ./logs/

      - name: 'Test with onsdriver'
        timeout-minutes: 3
        run: |
          python -m unittest discover test-onsdriver/

      - name: 'Upload logs of onsdriver'
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-${{ env.artifactName }}-linux-obs${{ matrix.obs }}-${{ matrix.ubuntu }}
          path: |
            logs/*

  legacy_cpp_build:
    name: Plugin build without Rust bridge
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Download OBS development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@02a425c434e39ae068e0bb830bc21bf68273fda3 # v3
        with:
          obs: 31
          verbose: true

      - name: Build plugin with Rust bridge disabled
        run: |
          set -ex
          if sudo apt-get -o Acquire::Retries=5 install -y libopenblas-dev libopenblas0; then
            export OPENBLAS_HOME=/lib/x86_64-linux-gnu/
          else
            echo "::warning::OpenBLAS unavailable; continuing without it"
            unset OPENBLAS_HOME
          fi
          cmake -S . -B build-legacy \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D ENABLE_RUST_CORE_BRIDGE=OFF \
            -D WITH_DOCK=ON \
            -D PKG_SUFFIX=-obs31-linux-bridge-off \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}
          cmake --build build-legacy --parallel 4
          ctest --test-dir build-legacy --output-on-failure

  macos_build:
    runs-on: ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: 32
            arch: 'x86_64'
            obs-onsdriver: '< 33'
            macos: macos-26-intel # Intel x86_64
          - obs: 33
            arch: 'x86_64'
            obs-onsdriver: '< 34'
            macos: macos-26-intel # Intel x86_64
          - obs: 32
            arch: 'arm64'
            obs-onsdriver: '< 33'
            macos: macos-26 # Apple arm64
          - obs: 33
            arch: 'arm64'
            obs-onsdriver: '< 34'
            macos: macos-26 # Apple arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # supports toolchain input
        with:
          toolchain: 1.98.0

      - name: Setup Environment
        id: setup
        env:
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          MACOS_SIGNING_INSTALLER_IDENTITY: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          set -e
          echo '::group::Set up code signing'
          have_codesign_ident=false
          have_notarization_user=false
          if [[ -n "$MACOS_SIGNING_APPLICATION_IDENTITY" || \
                -n "$MACOS_SIGNING_INSTALLER_IDENTITY" || \
                -n "$MACOS_SIGNING_CERT" || \
                -n "$MACOS_SIGNING_CERT_PASSWORD" ]]; then
            if [[ -z "$MACOS_SIGNING_APPLICATION_IDENTITY" || \
                  -z "$MACOS_SIGNING_INSTALLER_IDENTITY" || \
                  -z "$MACOS_SIGNING_CERT" || \
                  -z "$MACOS_SIGNING_CERT_PASSWORD" ]]; then
              echo '::error::macOS signing configuration is incomplete.'
              exit 1
            fi
            have_codesign_ident=true
            echo "haveCodesignIdent=true" >> $GITHUB_OUTPUT
          else
            echo "haveCodesignIdent=false" >> $GITHUB_OUTPUT
          fi
          if [[ -n "$MACOS_NOTARIZATION_USERNAME" || -n "$MACOS_NOTARIZATION_PASSWORD" ]]; then
            if [[ -z "$MACOS_NOTARIZATION_USERNAME" || -z "$MACOS_NOTARIZATION_PASSWORD" ]]; then
              echo '::error::macOS notarization configuration is incomplete.'
              exit 1
            fi
            have_notarization_user=true
            echo "haveNotarizationUser=true" >> $GITHUB_OUTPUT
          else
            echo "haveNotarizationUser=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && \
                ( "$have_codesign_ident" != 'true' || "$have_notarization_user" != 'true' ) ]]; then
            echo '::error::Tagged macOS builds require complete Developer ID signing and notarization secrets.'
            exit 1
          fi
          echo '::endgroup::'
          echo '::group::Set up ccache'
          brew install ccache
          ccache --set-config=cache_dir="${{ github.workspace }}/.ccache"
          ccache --set-config=compression=true
          echo '::endgroup::'

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: macos-obs${{ matrix.obs }}-${{ matrix.arch }}-ccache

      - name: Install Apple Developer Certificate
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        uses: apple-actions/import-codesign-certs@fe74d46e82474f87e1ba79832ad28a4013d0e33a # v6.1.0
        with:
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERT }}
          p12-password: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Set Signing Identity
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && steps.setup.outputs.haveNotarizationUser == 'true' }}
        env:
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          set -e
          if [[ "$MACOS_SIGNING_APPLICATION_IDENTITY" =~ \(([A-Za-z0-9]+)\)$ ]]; then
            TEAM_ID="${BASH_REMATCH[1]}"
          else
            echo '::error::The macOS signing identity must end with a parenthesized team ID.'
            exit 1
          fi
          xcrun notarytool store-credentials AC_PASSWORD \
            --apple-id "$MACOS_NOTARIZATION_USERNAME" \
            --team-id "$TEAM_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD"

      - name: Download obs-studio development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@02a425c434e39ae068e0bb830bc21bf68273fda3 # v3
        with:
          arch: ${{ matrix.arch }}
          obs: ${{ matrix.obs }}
          verbose: true

      - name: Download dlib-models
        run: |
          set -ex
          DESTDIR='./' ci/download-dlib-models.sh

      - name: Build plugin
        env:
          MACOS_SIGNING_APPLICATION_IDENTITY: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
        run: |
          arch=${{ matrix.arch }}
          GIT_TAG=$(git describe --tags --always)
          PKG_SUFFIX=-${GIT_TAG}-obs${{ matrix.obs }}-macos-${{ matrix.arch }}
          set -e
          # A host environment override must not silently raise the published
          # macOS floor. An intentional override remains available via -D.
          export MACOSX_DEPLOYMENT_TARGET=15.0
          unset OPENBLAS_HOME
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          test -f "$SDKROOT/usr/lib/libcblas.tbd"
          test -f "$SDKROOT/usr/lib/liblapack.tbd"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_RUST_CORE_BRIDGE=ON \
            -DCMAKE_PREFIX_PATH="$PWD/release/" \
            -DCMAKE_OSX_ARCHITECTURES=$arch \
            -D DLIB_USE_BLAS=ON \
            -D DLIB_USE_LAPACK=ON \
            -D cblas_lib="$SDKROOT/usr/lib/libcblas.tbd" \
            -D lapack_lib="$SDKROOT/usr/lib/liblapack.tbd" \
            -D PKG_SUFFIX=$PKG_SUFFIX \
            -D "OBS_BUNDLE_CODESIGN_IDENTITY=${MACOS_SIGNING_APPLICATION_IDENTITY}" \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}
          grep -q '^CMAKE_OSX_DEPLOYMENT_TARGET:STRING=13.0$' build/CMakeCache.txt
          cmake --build build --config RelWithDebInfo
          ctest --test-dir build --output-on-failure
          if [[ "${{ matrix.obs }}" == '33' && "${{ matrix.arch }}" == 'x86_64' ]]; then
            ctest --test-dir build --repeat until-fail:5 --output-on-failure \
              -R '^faithfulframe-offline-session-replay-geometry-integration$'
          fi
          python3 -m unittest tests/test_verify_macos_deployment_target.py

      - name: Prepare package
        run: |
          set -ex
          . build/ci/ci_includes.generated.sh
          cmake --install build --config RelWithDebInfo --prefix=release
          ci/macos/change-rpath.py \
            --exclude-regex='(/usr/lib/|/System/Library/)' \
            --exclude-regex='.*(obs-frontend-api|libobs|/Qt)' \
            --libdir release/${PLUGIN_NAME}.plugin/Contents/lib \
            --verbose \
            release/${PLUGIN_NAME}.plugin/Contents/MacOS/${PLUGIN_NAME}
          for dylib in \
            release/${PLUGIN_NAME}.plugin/Contents/MacOS/${PLUGIN_NAME} \
            release/${PLUGIN_NAME}.plugin/Contents/lib/*.dylib; do
            if test -f "$dylib"; then
              ci/macos/change-rpath.py \
                --exclude-regex='(/usr/lib/|/System/Library/)' \
                --exclude-regex='.*(obs-frontend-api|libobs|/Qt)' \
                --check-invalid-regex='(/usr/local|/opt)' \
                --check "$dylib"
            fi
          done
          python3 ci/macos/verify-deployment-target.py \
            --root release/${PLUGIN_NAME}.plugin \
            --cmake-cache build/CMakeCache.txt

      - name: Codesign
        env:
          HAVE_CODESIGN_IDENTITY: ${{ steps.setup.outputs.haveCodesignIdent }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
        run: |
          . build/ci/ci_includes.generated.sh
          set -ex
          bundle=release/${PLUGIN_NAME}.plugin
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' && "$HAVE_CODESIGN_IDENTITY" == 'true' ]]; then
            identity="$MACOS_CODESIGN_IDENTITY"
            signing_options=(--options runtime --timestamp)
          else
            # Non-release builds still exercise bundle sealing with an ad-hoc
            # signature. Tagged releases fail earlier unless Developer ID and
            # notarization credentials are configured.
            identity=-
            signing_options=(--options runtime)
          fi
          files=(
            $(find "$bundle" -name '*.dylib')
            "$bundle/Contents/MacOS/${PLUGIN_NAME}"
          )
          for code in "${files[@]}"; do
            codesign --force --sign "$identity" "${signing_options[@]}" "$code"
          done
          # Sign the outer plugin bundle last to seal Info.plist and all
          # shipped model, locale, and license resources.
          codesign --force --sign "$identity" "${signing_options[@]}" "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            signature_info="$(codesign -dv --verbose=4 "$bundle" 2>&1)"
            printf '%s\n' "$signature_info"
            grep -q '^Authority=Developer ID Application:' <<< "$signature_info"
            grep -q '^flags=.*runtime' <<< "$signature_info"
          fi

      - name: Package
        run: |
          . build/ci/ci_includes.generated.sh
          set -ex
          zipfile=$PWD/package/${PLUGIN_NAME}${PKG_SUFFIX}.zip
          mkdir package
          (cd release/ && zip -r $zipfile ${PLUGIN_NAME}.plugin)
          packagesbuild \
            --build-folder $PWD/package/ \
            build/installer-macOS.generated.pkgproj
          zip_file=$(find package -name '*.zip' -print -quit)
          test -n "$zip_file"
          mkdir -p package-audit
          unzip -q "$zip_file" -d package-audit
          python3 ci/verify-package-assets.py --root package-audit

      - name: Productsign
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        env:
          MACOS_SIGNING_INSTALLER_IDENTITY: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
        run: |
          . build/ci/ci_includes.generated.sh
          pkgfile=package/${PLUGIN_NAME}${PKG_SUFFIX}.pkg
          set -e
          productsign --sign "$MACOS_SIGNING_INSTALLER_IDENTITY" "$pkgfile" "package/${PLUGIN_NAME}-signed.pkg"
          mv package/${PLUGIN_NAME}-signed.pkg $pkgfile
          signature_info="$(pkgutil --check-signature "$pkgfile")"
          printf '%s\n' "$signature_info"
          grep -q 'Developer ID Installer:' <<< "$signature_info"

      - name: Notarize
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && steps.setup.outputs.haveNotarizationUser == 'true' }}
        uses: norihiro/macos-notarize-action@188aebd8f795d9e1ce8d48d4a54f5ce6d2c9864c # v1
        with:
          path: package/*
          keychainProfile: AC_PASSWORD
          verbose: true

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: package/*

      - name: Prepare isolated macOS OBS profile
        if: ${{ matrix.obs == 33 && matrix.arch == 'arm64' }}
        env:
          HOME: ${{ runner.temp }}/faithfulframe-obs-home
          CFFIXED_USER_HOME: ${{ runner.temp }}/faithfulframe-obs-home
        run: mkdir -p "$HOME/Library/Logs/DiagnosticReports"

      - name: 'Setup with onsdriver'
        if: ${{ matrix.obs == 33 && matrix.arch == 'arm64' }}
        timeout-minutes: 15
        uses: noris-plugins-for-obs/onsdriver@63e771126ada7a685538e146b87dcfae220384de # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOME: ${{ runner.temp }}/faithfulframe-obs-home
          # OBS resolves its macOS Application Support path through Foundation,
          # which does not follow HOME alone when the account home is available.
          # Keep OBS and onsdriver on the same isolated per-job profile.
          CFFIXED_USER_HOME: ${{ runner.temp }}/faithfulframe-obs-home
        with:
          obs-plugins: package/*.zip
          obs-architecture: ${{ matrix.arch }}
          obs-version: ${{ matrix.obs-onsdriver }}
          first-time-log: ./logs/

      - name: 'Test with onsdriver'
        if: ${{ matrix.obs == 33 && matrix.arch == 'arm64' }}
        timeout-minutes: 5
        env:
          HOME: ${{ runner.temp }}/faithfulframe-obs-home
          CFFIXED_USER_HOME: ${{ runner.temp }}/faithfulframe-obs-home
        run: python -m unittest discover test-onsdriver/

      - name: 'Upload Apple Silicon OBS smoke logs'
        if: ${{ always() && matrix.obs == 33 && matrix.arch == 'arm64' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: logs/*

      - name: Prepare isolated Apple Silicon signed-package profile
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && matrix.obs == 33 && matrix.arch == 'arm64' }}
        env:
          HOME: ${{ runner.temp }}/faithfulframe-obs-signed-home
          CFFIXED_USER_HOME: ${{ runner.temp }}/faithfulframe-obs-signed-home
        run: mkdir -p "$HOME/Library/Logs/DiagnosticReports" ./logs-signed-package

      - name: Setup Apple Silicon OBS from signed release package
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && matrix.obs == 33 && matrix.arch == 'arm64' }}
        timeout-minutes: 15
        uses: noris-plugins-for-obs/onsdriver@63e771126ada7a685538e146b87dcfae220384de # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOME: ${{ runner.temp }}/faithfulframe-obs-signed-home
          CFFIXED_USER_HOME: ${{ runner.temp }}/faithfulframe-obs-signed-home
        with:
          obs-plugins: package/*.pkg
          obs-architecture: ${{ matrix.arch }}
          obs-version: ${{ matrix.obs-onsdriver }}
          first-time-log: ./logs-signed-package/

      - name: Test Apple Silicon signed package with onsdriver
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && matrix.obs == 33 && matrix.arch == 'arm64' }}
        timeout-minutes: 5
        env:
          HOME: ${{ runner.temp }}/faithfulframe-obs-signed-home
          CFFIXED_USER_HOME: ${{ runner.temp }}/faithfulframe-obs-signed-home
        run: python -m unittest discover test-onsdriver/

      - name: Upload Apple Silicon signed-package logs
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && matrix.obs == 33 && matrix.arch == 'arm64' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}-signed-package
          path: logs-signed-package/*

      - name: 'Setup with onsdriver from signed release package'
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && !(matrix.obs == 33 && matrix.arch == 'arm64') }}
        uses: noris-plugins-for-obs/onsdriver@63e771126ada7a685538e146b87dcfae220384de # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: package/*.pkg
          first-time-log: ./logs/
          obs-version: ${{ matrix.obs-onsdriver }}

      - name: 'Test signed package with onsdriver'
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && !(matrix.obs == 33 && matrix.arch == 'arm64') }}
        timeout-minutes: 3
        run: |
          python -m unittest discover test-onsdriver/

      - name: 'Upload signed package onsdriver logs'
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' && !(matrix.obs == 33 && matrix.arch == 'arm64') }}
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-${{ env.artifactName }}-macos-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: |
            logs/*

  windows_build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs: 30
            arch: 'x64'
            runner: 'windows-2022'
            # Keep the runtime test on OBS 30; <33 drifts to newer OBS releases.
            obs-onsdriver: '< 31'
            # onsdriver's OBS 30 setup crashes when --size calls get_profile()
            # before OBS has populated General/LastVersion. This module-load
            # job does not need an explicit canvas size.
            graphics-size: ''
          - obs: 33
            arch: 'x64'
            runner: 'windows-2025-vs2026'
            graphics-size: '1280x720'
          - obs: 33
            arch: 'arm64'
            runner: 'windows-11-arm'
            graphics-size: '1280x720'
    env:
      Configuration: 'RelWithDebInfo'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Validate Windows signing helper syntax
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ci/windows/sign-authenticode.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Windows Authenticode helper has PowerShell syntax errors.'
          }

      - name: Setup Windows signing certificate
        id: windows_signing
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if (-not $hasCertificate -and -not $hasPassword) {
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw 'Tagged Windows releases require WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD.'
            }
            'hasCertificate=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Windows signing certificate is not configured; this non-release build will remain unsigned.'
            return
          }
          if (-not $hasCertificate -or -not $hasPassword) {
            throw 'Windows signing configuration is incomplete; provide both certificate and password secrets.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'FaithfulFrameCodeSigning.pfx'
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificatePath,
              $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            if (-not $certificate.HasPrivateKey) {
              throw 'The Windows signing certificate has no private key.'
            }
            if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
              throw 'The Windows signing certificate has expired.'
            }
            $ekuExtension = $certificate.Extensions |
              Where-Object { $_.Oid.Value -eq '2.5.29.37' } |
              Select-Object -First 1
            $hasCodeSigningEku = $ekuExtension -and ($ekuExtension.EnhancedKeyUsages |
              Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' })
            if (-not $hasCodeSigningEku) {
              throw 'The Windows signing certificate does not include the Code Signing EKU.'
            }
            $certificate.Dispose()
          } catch {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            throw "Windows signing certificate validation failed: $($_.Exception.Message)"
          }

          "WINDOWS_SIGNING_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV
          'hasCertificate=true' >> $env:GITHUB_OUTPUT

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # supports toolchain input
        with:
          toolchain: 1.98.0

      - name: Download obs-studio
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@02a425c434e39ae068e0bb830bc21bf68273fda3 # v3
        with:
          obs: ${{ matrix.obs }}
          arch: ${{ matrix.arch }}

      - name: Download dlib-models
        shell: bash
        run: |
          set -ex
          DESTDIR='./' ci/download-dlib-models.sh

      - name: Build plugin
        run: |
          $CmakeArgs = @()
          $CmakeArgs += '-DENABLE_RUST_CORE_BRIDGE=ON'
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $CmakeArgs += '-DUSE_SSE2_INSTRUCTIONS=OFF'
          }

          cmake -S . -B build ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS_PS }} @CmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with exit code $LASTEXITCODE" }
          cmake --build build --config RelWithDebInfo -j 4
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with exit code $LASTEXITCODE" }
          ctest --test-dir build -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest failed with exit code $LASTEXITCODE" }
          cmake --install build --config RelWithDebInfo --prefix "$(Resolve-Path -Path .)/release"
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed with exit code $LASTEXITCODE" }

      - name: Exercise Authenticode verification helper with PowerShell
        timeout-minutes: 5
        run: |
          $signedPowerShell = Join-Path $PSHOME 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $signedPowerShell -PathType Leaf)) {
            throw "PowerShell executable not found for Authenticode smoke test: $signedPowerShell"
          }

          Write-Host "Verifying the PowerShell executable at $signedPowerShell"
          & ./ci/windows/sign-authenticode.ps1 -Files @($signedPowerShell) -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Authenticode helper smoke test failed with exit code $LASTEXITCODE" }
          Write-Host 'Authenticode verification helper smoke test passed'

      - name: Sign Windows plugin binary
        if: ${{ github.event_name != 'pull_request' && steps.windows_signing.outputs.hasCertificate == 'true' }}
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          & ./ci/windows/sign-authenticode.ps1 -Files @('release/face-tracker/face-tracker.dll')
          if ($LASTEXITCODE -ne 0) { throw "Plugin Authenticode signing failed with exit code $LASTEXITCODE" }

      - name: Package plugin
        run: |
          ci/windows/package-windows.cmd ${{ matrix.obs }} ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw "Package build failed with exit code $LASTEXITCODE" }
          $zip = Get-ChildItem package -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Plugin ZIP was not produced" }
          7z x $zip.FullName '-opackage-audit' '-y' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Plugin ZIP extraction failed with exit code $LASTEXITCODE" }
          python ci/verify-package-assets.py --root package-audit
          if ($LASTEXITCODE -ne 0) { throw "Package asset verification failed with exit code $LASTEXITCODE" }

      - name: Sign Windows installer
        if: ${{ github.event_name != 'pull_request' && steps.windows_signing.outputs.hasCertificate == 'true' }}
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $installers = @(Get-ChildItem package -Filter '*-Installer.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)" }
          & ./ci/windows/sign-authenticode.ps1 -Files @($installers[0].FullName)
          if ($LASTEXITCODE -ne 0) { throw "Installer Authenticode signing failed with exit code $LASTEXITCODE" }

      - name: Verify signed Windows package contents
        if: ${{ github.event_name != 'pull_request' && steps.windows_signing.outputs.hasCertificate == 'true' }}
        run: |
          $pluginDll = 'package-audit/face-tracker/face-tracker.dll'
          $installers = @(Get-ChildItem package -Filter '*-Installer.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)" }
          & ./ci/windows/sign-authenticode.ps1 -VerifyOnly -Files @($pluginDll, $installers[0].FullName)
          if ($LASTEXITCODE -ne 0) { throw "Packaged Authenticode verification failed with exit code $LASTEXITCODE" }

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.artifactName }}-windows-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: package/*

      - name: 'Setup with onsdriver'
        # Windows ARM64 builds are useful compile/package coverage, but the
        # onsdriver bootstrap cannot install its helper plugin under ProgramData
        # on the Windows ARM runner. Keep OBS runtime validation on production x64.
        if: ${{ matrix.arch == 'x64' }}
        uses: noris-plugins-for-obs/onsdriver@63e771126ada7a685538e146b87dcfae220384de # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          obs-plugins: package/*.exe
          first-time-log: ./logs/
          obs-version: ${{ matrix.obs-onsdriver }}
          graphics-size: ${{ matrix.graphics-size }}

      - name: 'Test with onsdriver'
        if: ${{ matrix.arch == 'x64' }}
        timeout-minutes: 3
        run: |
          python -m unittest discover test-onsdriver/

      - name: 'Upload logs of onsdriver'
        if: ${{ always() && matrix.arch == 'x64' }}
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-${{ env.artifactName }}-windows-obs${{ matrix.obs }}-${{ matrix.arch }}
          path: |
            logs/*

      - name: Remove Windows signing certificate
        if: ${{ always() }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'FaithfulFrameCodeSigning.pfx'
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue

  rust_core_tests:
    name: Rust core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # supports toolchain input
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Test performance recording tools
        run: |
          python -m unittest discover -s tests -p 'test_analyze_performance_logs.py'
          python -m unittest discover -s tests -p 'test_collect_obs_baseline.py'
          python -m unittest discover -s tests -p 'test_faithfulframe_offline_benchmark.py'

      - name: Test Windows installer naming and compatibility paths
        run: python -m unittest discover -s tests -p 'test_windows_installer_template.py'

      - name: Test GitHub Actions security policy
        run: python -m unittest discover -s tests -p 'test_github_actions_security.py'

      - name: Verify Rust production dependency allowlist
        run: |
          python -m unittest discover -s tests -p 'test_verify_rust_runtime_deps.py'
          python ci/verify-rust-runtime-deps.py --manifest rust/faithfulframe-ffi/Cargo.toml

      - name: Guard serialized Rust session ownership
        run: python -m unittest discover -s tests -p 'test_faithfulframe_executor_ownership.py'

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust/faithfulframe-core/Cargo.toml -- --check
          cargo fmt --manifest-path rust/faithfulframe-ffi/Cargo.toml -- --check

      - name: Run deterministic core, fixture, and FFI tests
        run: |
          cargo test --locked --manifest-path rust/faithfulframe-core/Cargo.toml
          cargo test --locked --manifest-path rust/faithfulframe-ffi/Cargo.toml

      - name: Run Clippy with warnings denied
        run: |
          cargo clippy --locked --manifest-path rust/faithfulframe-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path rust/faithfulframe-ffi/Cargo.toml --all-targets -- -D warnings

  thread_sanitizer_tests:
    name: C++ concurrency tests with ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # supports toolchain input
        with:
          toolchain: 1.98.0

      - name: Download OBS development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@02a425c434e39ae068e0bb830bc21bf68273fda3 # v3
        with:
          obs: 31
          verbose: true

      - name: Configure ThreadSanitizer build
        run: |
          if sudo apt-get -o Acquire::Retries=5 install -y libopenblas-dev libopenblas0; then
            export OPENBLAS_HOME=/lib/x86_64-linux-gnu/
          else
            echo "::warning::OpenBLAS unavailable; continuing sanitizer checks without it"
            unset OPENBLAS_HOME
          fi
          cmake -S . -B build-tsan \
            -D CMAKE_BUILD_TYPE=Debug \
            -D ENABLE_RUST_CORE_BRIDGE=ON \
            -D WITH_DOCK=OFF \
            -D WITH_PTZ_TCP=OFF \
            -D CMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -D CMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -D CMAKE_EXE_LINKER_FLAGS='-fsanitize=thread' \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}

      - name: Build concurrency and teardown smoke tests
        run: |
          cmake --build build-tsan --parallel 4 --target \
            faithfulframe-session-executor-smoke \
            faithfulframe-active-slot-smoke \
            faithfulframe-single-adapter-lease-smoke \
            faithfulframe-deferred-pending-smoke \
            faithfulframe-detector-worker-smoke \
            faithfulframe-tracker-worker-smoke \
            faithfulframe-worker-log-gate-smoke \
            faithfulframe-dlib-tracker-lifetime-smoke

      - name: Run ThreadSanitizer checks
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: >-
          ctest --test-dir build-tsan --output-on-failure --timeout 30
          -R '^faithfulframe-(session-executor|active-slot|single-adapter-lease|deferred-pending|detector-worker|tracker-worker|worker-log-gate|dlib-tracker-lifetime)-smoke$'

  address_sanitizer_tests:
    name: C++ lifetime tests with AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # supports toolchain input
        with:
          toolchain: 1.98.0

      - name: Download OBS development environment
        id: obsdeps
        uses: norihiro/obs-studio-devel-action@02a425c434e39ae068e0bb830bc21bf68273fda3 # v3
        with:
          obs: 31
          verbose: true

      - name: Configure AddressSanitizer and UBSan build
        run: |
          if sudo apt-get -o Acquire::Retries=5 install -y libopenblas-dev libopenblas0; then
            export OPENBLAS_HOME=/lib/x86_64-linux-gnu/
          else
            echo "::warning::OpenBLAS unavailable; continuing sanitizer checks without it"
            unset OPENBLAS_HOME
          fi
          cmake -S . -B build-asan \
            -D CMAKE_BUILD_TYPE=Debug \
            -D ENABLE_RUST_CORE_BRIDGE=ON \
            -D WITH_DOCK=OFF \
            -D WITH_PTZ_TCP=OFF \
            -D CMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -D CMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -D CMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            ${{ steps.obsdeps.outputs.PLUGIN_CMAKE_OPTIONS }}

      - name: Build concurrency and teardown smoke tests
        run: |
          cmake --build build-asan --parallel 4 --target \
            faithfulframe-session-executor-smoke \
            faithfulframe-active-slot-smoke \
            faithfulframe-single-adapter-lease-smoke \
            faithfulframe-deferred-pending-smoke \
            faithfulframe-detector-worker-smoke \
            faithfulframe-tracker-worker-smoke \
            faithfulframe-worker-log-gate-smoke \
            faithfulframe-dlib-tracker-lifetime-smoke

      - name: Run AddressSanitizer and UBSan checks
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-asan --output-on-failure --timeout 30
          -R '^faithfulframe-(session-executor|active-slot|single-adapter-lease|deferred-pending|detector-worker|tracker-worker|worker-log-gate|dlib-tracker-lifetime)-smoke$'
